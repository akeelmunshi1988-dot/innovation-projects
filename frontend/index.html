<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handmade Rugs & Carpets from India | DreamRugsCreation</title>
    <meta name="description" content="Hand-knotted and hand-tufted wool and silk rugs, woven in Bhadohi, India and made to your exact size and design. Custom carpets, shipped worldwide." />
    <!-- scripts/prerender.js puts a plain-text summary of each page inside #root for
         crawlers and link-preview bots. Keep it readable to them and to screen
         readers, but don't flash it as unstyled text before React renders the page. -->
    <style>
      #root > [data-prerendered-content] { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
